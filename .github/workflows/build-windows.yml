
name: Build AimForge for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AimForge/requirements.txt pyinstaller

      - name: Build EXE
        working-directory: AimForge
        run: pyinstaller --noconfirm --clean AimForge.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AimForge-Windows
          path: AimForge/dist/AimForge.exe
